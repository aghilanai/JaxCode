[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-judge"
dynamic = ["version"]
description = "JAX/Flax NNX coding judge for Jupyter — check implementations against test cases (JaxCode)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "duoan" }
]
keywords = ["jax", "flax", "nnx", "jupyter", "notebook", "judge", "jaxcode", "interview", "practice"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "flax>=0.10.0",
    "optax>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "build",
    "twine",
]

[tool.setuptools.packages.find]
include = ["jax_judge*"]
exclude = ["labextension*", "scripts*", "templates*", "solutions*", "jupyter_config*"]

[tool.setuptools.dynamic]
version = {attr = "jax_judge._version.__version__"}
